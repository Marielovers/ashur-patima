<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#291b30" />
  <meta name="description" content="에슈르 빵댕이 때리기 — 좌우 클릭 반응 Live2D 미니게임" />
  <title>에슈르 빵댕이 때리기</title>
</head>
<body>
  <main id="game" class="game" aria-label="에슈르 빵댕이 때리기">
    <!-- PC/mobile share this same centered stage to keep model + background in proportion. -->
    <div id="sceneStage" class="scene-stage">
      <div id="sceneBackdrop" class="backdrop" aria-hidden="true"></div>
      <div class="background-vignette" aria-hidden="true"></div>
      <div id="live2dHost" class="live2d-host" aria-label="에슈르 캐릭터. 왼쪽과 오른쪽 히트 영역을 터치해보세요"></div>
      <div id="rippleLayer" class="ripple-layer" aria-hidden="true"></div>
    </div>

    <section id="startScreen" class="start-screen" aria-labelledby="gameTitle">
      <div class="start-screen-shade" aria-hidden="true"></div>
      <div class="start-card">
        <div class="start-ornament" aria-hidden="true">✦ &nbsp; ✧ &nbsp; ✦</div>
        <h1 id="gameTitle">에슈르<br /><span>빵댕이 때리기</span></h1>
        <p id="loadingMessage" class="loading-message" aria-live="polite">모델을 불러오는 중…</p>
        <button id="startButton" class="start-button" type="button" disabled>시작하기 <span aria-hidden="true">♡</span></button>
        <p id="errorMessage" class="error-message" role="alert" hidden></p>
      </div>
    </section>
  </main>
  <script>
    // 이 프로젝트는 Vite 소스 형태이므로 file:// 직접 실행을 지원하지 않습니다.
    if (location.protocol === 'file:') {
      const loading = document.getElementById('loadingMessage');
      const error = document.getElementById('errorMessage');
      const button = document.getElementById('startButton');
      loading.textContent = '실행 방법을 확인해 주세요';
      error.hidden = false;
      error.textContent = 'index.html을 직접 열면 실행되지 않아요.\n압축을 푼 폴더의 「실행하기.bat」을 더블클릭하거나, GitHub Pages에 배포해 주세요.\n처음 실행할 때는 Node.js 설치와 인터넷 연결이 필요합니다.';
      button.disabled = true;
    } else {
      window.addEventListener('error', (event) => {
        const loading = document.getElementById('loadingMessage');
        const error = document.getElementById('errorMessage');
        if (!error || !loading || document.getElementById('startScreen').hidden) return;
        loading.textContent = '페이지 실행 중 오류가 발생했어요';
        error.hidden = false;
        error.textContent = '스크립트 로딩 오류: ' + (event.message || '모듈 로딩에 실패했습니다. F12 → Console을 확인해 주세요.');
      });
      window.addEventListener('unhandledrejection', (event) => {
        const error = document.getElementById('errorMessage');
        const loading = document.getElementById('loadingMessage');
        if (!error || !loading || document.getElementById('startScreen').hidden) return;
        loading.textContent = '실행 중 오류가 발생했어요';
        error.hidden = false;
        error.textContent = String(event.reason?.message || event.reason || '알 수 없는 오류');
      });
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
